<section class="py-5">
  <div class="container-xl">
    <h2 class="section-title text-center mx-auto">Don't take our word for it, here's what our customers think.</h2>
    <div class="row g-4 mt-2">
      <div class="col-md-6 col-lg-3" *ngFor="let t of testimonials; let i = index; let odd = odd">
        <div class="testimonial-card animate-in" [class.testimonial-accent]="odd" appScrollReveal [revealDelay]="i * 100">
          <i class="bi bi-quote testimonial-quote-icon"></i>
          <p class="testimonial-msg">{{ t.message }}</p>
          <div class="testimonial-rating">
            <i class="bi bi-star-fill" *ngFor="let s of stars; let si = index" [class.text-muted]="si >= t.rating"></i>
          </div>
          <div class="d-flex align-items-center gap-3 mt-3">
            <app-avatar [name]="t.name"></app-avatar>
            <div>
              <h6 class="mb-0">{{ t.name }}</h6>
              <small class="testimonial-date">{{ t.date }}</small>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
