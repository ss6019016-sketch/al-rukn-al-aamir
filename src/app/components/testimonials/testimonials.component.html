<section class="py-5">
  <div class="container-xl">
    <h2 class="section-title text-center mx-auto">Don't take our word for it, here's what our customers think.</h2>
    <div class="row g-4 mt-2">
      <div class="col-md-6 col-lg-3" *ngFor="let t of testimonials; let i = index">
        <div class="testimonial-card animate-in" appScrollReveal [revealDelay]="i * 100">
          <div class="d-flex align-items-center gap-3 mb-2">
            <app-avatar [name]="t.name"></app-avatar>
            <div>
              <h6 class="mb-0">{{ t.name }}</h6>
              <small class="text-muted">{{ t.date }}</small>
            </div>
          </div>
          <p class="testimonial-msg">"{{ t.message }}"</p>
        </div>
      </div>
    </div>
  </div>
</section>
