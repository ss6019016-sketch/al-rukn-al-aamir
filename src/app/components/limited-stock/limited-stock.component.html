<section class="limited-stock-section py-4 py-md-5 bg-soft">
  <div class="container-xl">
    <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center section-header">
      <h2 class="section-title mb-0">Limited Stock</h2>
      <a routerLink="/shop" class="view-all">View all products <i class="bi bi-arrow-right"></i></a>
    </div>
    <div class="row g-3 g-md-4 mt-1">
      <div class="col-6 col-md-4 col-xl-2" *ngFor="let p of products">
        <app-product-card [product]="p"></app-product-card>
      </div>
    </div>
  </div>
</section>
