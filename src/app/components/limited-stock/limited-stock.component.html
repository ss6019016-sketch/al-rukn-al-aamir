<section class="py-5 bg-soft">
  <div class="container-xl">
    <div class="d-flex justify-content-between align-items-center">
      <h2 class="section-title">Limited Stock</h2>
      <a routerLink="/shop" class="view-all">View all products <i class="bi bi-arrow-right"></i></a>
    </div>
    <div class="row g-4">
      <div class="col-6 col-md-4 col-lg-2-4" *ngFor="let p of products">
        <app-product-card [product]="p"></app-product-card>
      </div>
    </div>
  </div>
</section>
