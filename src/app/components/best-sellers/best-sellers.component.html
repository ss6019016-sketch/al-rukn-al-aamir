<section class="py-5 bg-soft">
  <div class="container-xl">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
      <h2 class="section-title">Best Sellers</h2>
      <ul class="tab-list">
        <li *ngFor="let t of tabs" appRipple [class.active]="t === activeTab" (click)="setTab(t)">{{ t }}</li>
      </ul>
    </div>

    <div class="row g-4 best-sellers-grid" [class.tab-changing]="tabChanging">
      <div class="col-6 col-md-4 col-xl-2" *ngFor="let p of filteredProducts; let i = index">
        <div class="animate-in" appScrollReveal [revealDelay]="i * 60">
          <app-product-card [product]="p"></app-product-card>
        </div>
      </div>
    </div>
  </div>
</section>
