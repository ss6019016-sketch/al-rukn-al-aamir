<div class="auth-backdrop" *ngIf="isOpen" (click)="close()"></div>

<div class="auth-modal" *ngIf="isOpen">
  <button class="auth-close" (click)="close()" aria-label="Close">
    <i class="bi bi-x-lg"></i>
  </button>

  <h3 class="mb-4">{{ mode === 'login' ? 'Sign In' : 'Create Account' }}</h3>

  <form (ngSubmit)="submit()">
    <div class="mb-3" *ngIf="mode === 'register'">
      <label class="form-label">Full Name</label>
      <input type="text" class="form-control" required />
    </div>

    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" [(ngModel)]="email" name="email" required />
    </div>

    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" class="form-control" [(ngModel)]="password" name="password" required />
    </div>

    <button type="submit" class="btn btn-accent w-100">
      {{ mode === 'login' ? 'Log In' : 'Sign Up' }}
    </button>
  </form>

  <p class="text-center mt-3 mb-0 small">
    <ng-container *ngIf="mode === 'login'">
      Don't have an account? <a href="javascript:void(0)" (click)="switchMode('register')">Create one</a>
    </ng-container>
    <ng-container *ngIf="mode === 'register'">
      Already have an account? <a href="javascript:void(0)" (click)="switchMode('login')">Sign in</a>
    </ng-container>
  </p>
</div>
