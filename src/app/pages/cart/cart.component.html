<section class="py-5"><div class="container-xl"><h1 class="section-title">Your cart</h1><ng-container *ngIf="items$ | async as items"><div *ngIf="items.length; else empty" class="row g-4"><div class="col-lg-8"><div class="border rounded-3 overflow-hidden"><div class="d-flex align-items-center gap-3 p-3 border-bottom" *ngFor="let item of items"><img [src]="item.product.image" [alt]="item.product.name" width="90" height="70" style="object-fit: contain"><div class="flex-grow-1"><h2 class="h6 mb-1">{{ item.product.name }}</h2><span class="text-muted">د.إ{{ item.product.priceRange?.min || item.product.price }}</span></div><div class="d-flex align-items-center gap-2"><button class="btn btn-sm btn-outline-secondary" (click)="update(item, item.quantity - 1)">−</button><span>{{ item.quantity }}</span><button class="btn btn-sm btn-outline-secondary" (click)="update(item, item.quantity + 1)">+</button></div><button class="btn btn-sm text-danger" title="Remove" (click)="remove(item)"><i class="bi bi-trash"></i></button></div></div></div><div class="col-lg-4"><div class="bg-soft rounded-3 p-4"><h2 class="h5">Cart total</h2><div class="d-flex justify-content-between my-3"><span>Subtotal</span><strong>د.إ{{ total$ | async }}</strong></div><a routerLink="/checkout" class="btn btn-accent w-100">Proceed to checkout</a></div></div></div><ng-template #empty><div class="text-center py-5"><i class="bi bi-cart-x fs-1 text-muted"></i><h2 class="h4 mt-3">Your cart is currently empty.</h2><a routerLink="/shop" class="btn btn-accent mt-2">Browse products</a></div></ng-template></ng-container></div></section>
