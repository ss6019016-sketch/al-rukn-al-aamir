<section class="shop-page py-5">
  <div class="container-xl">
    <app-breadcrumb
      [category]="breadcrumbCategory"
      [subcategory]="breadcrumbSubcategory"
      [categoryQuery]="category ? { category: category } : (brand ? { brand: brand } : null)"
    ></app-breadcrumb>

    <div class="shop-heading d-flex flex-wrap justify-content-between align-items-end gap-3">
      <div>
        <p class="eyebrow">Al Rukn Al Aamir collection</p>
        <h1 class="section-title mb-0">{{ pageTitle }}</h1>
      </div>
      <span class="result-count">{{ products.length }} products</span>
    </div>

    <div class="row g-4 mt-2">
      <div class="col-lg-3">
        <app-filter-sidebar [products]="allProducts" (filtersApplied)="applyFilters($event)"></app-filter-sidebar>
      </div>

      <div class="col-lg-9" *ngIf="products.length; else noProducts">
        <div class="product-toolbar">
          <label for="shop-sort">Sort by</label>
          <select id="shop-sort" class="form-select" [(ngModel)]="sort" (ngModelChange)="changeSort($event)">
            <option value="default">Default order</option>
            <option value="price-low">Price: Low to High</option>
            <option value="price-high">Price: High to Low</option>
            <option value="newest">Newest First</option>
            <option value="rating">Rating: High to Low</option>
          </select>
        </div>
        <div class="row g-4">
          <div class="col-6 col-md-4 col-xl-3" *ngFor="let product of visibleProducts">
            <app-product-card [product]="product"></app-product-card>
          </div>
        </div>
        <div class="load-more-wrap" *ngIf="visibleProducts.length < products.length">
          <button type="button" class="btn btn-accent" (click)="loadMore()">Load More</button>
        </div>
      </div>
    </div>

    <ng-template #noProducts>
      <div class="empty-shop text-center py-5">
        <i class="bi bi-search fs-1 text-muted empty-state-icon" aria-hidden="true"></i>
        <h2 class="h4 mt-3">No products found</h2>
        <p class="text-muted">Try another category, brand, or search term.</p>
        <a routerLink="/shop" class="btn btn-accent">View all products</a>
      </div>
    </ng-template>
  </div>
</section>
