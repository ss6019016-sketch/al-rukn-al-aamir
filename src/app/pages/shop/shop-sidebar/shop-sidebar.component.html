<div class="shop-sidebar">
  <img class="sidebar-promo" src="https://placehold.co/560x220/0d2b4e/ffffff?text=Quality+Laptops+%7C+Tested+%26+Ready" alt="Quality laptops">

  <section class="filter-block">
    <div class="filter-heading"><h2>Price</h2><span>12,000 د.إ</span></div>
    <div class="price-values"><span>{{ filters.minPrice | number }} د.إ</span><span>{{ filters.maxPrice | number }} د.إ</span></div>
    <div class="range-wrap">
      <input type="range" min="299" max="12000" step="25" [(ngModel)]="filters.minPrice" (input)="filters.minPrice = filters.minPrice > filters.maxPrice ? filters.maxPrice : filters.minPrice; update()">
      <input type="range" min="299" max="12000" step="25" [(ngModel)]="filters.maxPrice" (input)="filters.maxPrice = filters.maxPrice < filters.minPrice ? filters.minPrice : filters.maxPrice; update()">
    </div>
    <div class="range-ticks"><span>299</span><span>3,224</span><span>6,150</span><span>9,075</span><span>12,000</span></div>
  </section>

  <section class="filter-block check-list">
    <label><input type="checkbox" [(ngModel)]="filters.featured" (change)="update()"> Featured products</label>
    <label><input type="checkbox" [(ngModel)]="filters.inStock" (change)="update()"> In stock</label>
    <label><input type="checkbox" [(ngModel)]="filters.onSale" (change)="update()"> On sale</label>
  </section>

  <section class="filter-block">
    <label class="filter-label" for="category">Product categories</label>
    <select id="category" class="form-select" [(ngModel)]="filters.category" (change)="update()">
      <option value="All">All categories</option>
      <option *ngFor="let category of categories" [value]="category">{{ category }}</option>
    </select>
  </section>
  <section class="filter-block">
    <label class="filter-label" for="tags">Product tags</label>
    <select id="tags" class="form-select"><option>Choose a tag</option><option>Refurbished</option><option>Business</option><option>Gaming</option></select>
  </section>
  <button class="reset-link" type="button" (click)="reset()">Reset filters</button>
</div>
