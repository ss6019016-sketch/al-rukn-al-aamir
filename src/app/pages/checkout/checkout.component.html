<section class="py-5"><div class="container-xl"><h1 class="section-title">Checkout</h1><div class="row"><div class="col-lg-8"><form class="border rounded-3 p-4" (ngSubmit)="placeOrder()" #checkoutForm="ngForm" *ngIf="!submitted"><div class="row g-3"><div class="col-md-6"><label class="form-label">First name</label><input name="firstName" class="form-control" required ngModel></div><div class="col-md-6"><label class="form-label">Last name</label><input name="lastName" class="form-control" required ngModel></div><div class="col-12"><label class="form-label">Address</label><input name="address" class="form-control" required ngModel></div><div class="col-md-6"><label class="form-label">City</label><input name="city" class="form-control" required ngModel></div><div class="col-md-6"><label class="form-label">Phone</label><input name="phone" class="form-control" required ngModel></div></div><button class="btn btn-accent mt-4" [disabled]="checkoutForm.invalid">Place dummy order</button></form><div class="alert alert-success" *ngIf="submitted"><h2 class="h5">Order received.</h2><p class="mb-0">This is a frontend-only checkout. No payment was processed.</p></div></div></div></div></section>
