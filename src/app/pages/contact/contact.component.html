<section class="py-5"><div class="container-xl"><div class="row g-5"><div class="col-lg-5"><p class="product-cat">We are here to help</p><h1 class="section-title">Contact us</h1><p>Tell us what you are looking for and our team will get back to you with a helpful answer.</p><p><i class="bi bi-telephone text-accent"></i> +971-526511946</p><p><i class="bi bi-envelope text-accent"></i> hello@Al Rukn Al Aamir.com</p></div><div class="col-lg-7"><form class="border rounded-3 p-4" (ngSubmit)="submit()" #contactForm="ngForm" *ngIf="!submitted"><label class="form-label">Name</label><input name="name" class="form-control mb-3" required ngModel><label class="form-label">Email</label><input name="email" type="email" class="form-control mb-3" required ngModel><label class="form-label">Message</label><textarea name="message" rows="5" class="form-control mb-3" required ngModel></textarea><button class="btn btn-accent" [disabled]="contactForm.invalid">Send message</button></form><div class="alert alert-success" *ngIf="submitted"><h2 class="h5">Thanks for reaching out.</h2><p class="mb-0">Your message has been received. We will reply shortly.</p></div></div></div></div></section>
