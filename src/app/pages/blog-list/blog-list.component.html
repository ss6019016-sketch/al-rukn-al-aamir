<section class="py-5">
  <div class="container-xl">
    <h1 class="section-title">Blogs</h1>
    <div class="row g-4 mt-2">
      <div class="col-md-4" *ngFor="let post of posts">
        <a [routerLink]="['/blogs', post.id]" class="text-decoration-none text-dark">
          <img [src]="post.image" [alt]="post.title" class="img-fluid rounded-3 mb-3" />
          <span class="text-muted small">{{ post.date }}</span>
          <h2 class="h5 mt-1">{{ post.title }}</h2>
          <p class="text-muted">{{ post.excerpt }}</p>
        </a>
      </div>
    </div>
  </div>
</section>
