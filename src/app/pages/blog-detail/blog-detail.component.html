<section class="py-5" *ngIf="post; else missing">
  <div class="container-xl animate-in" appScrollReveal>
    <a routerLink="/blogs" class="text-muted"><i class="bi bi-arrow-left"></i> Back to blogs</a>
    <img [src]="post.image" [alt]="post.title" class="img-fluid rounded-3 my-4" />
    <span class="text-muted small">{{ post.date }}</span>
    <h1 class="mt-1">{{ post.title }}</h1>
    <p class="mt-3">{{ post.content }}</p>
  </div>
</section>
<ng-template #missing>
  <section class="py-5 text-center">
    <h1 class="h3">Post not found</h1>
    <a routerLink="/blogs" class="btn btn-accent mt-3">Return to blogs</a>
  </section>
</ng-template>
