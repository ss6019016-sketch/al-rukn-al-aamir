<section class="py-5"><div class="container-xl"><h1 class="section-title">Wishlist</h1><ng-container *ngIf="products$ | async as products"><div class="row g-4" *ngIf="products.length; else empty"><div class="col-sm-6 col-lg-3 wishlist-item" [class.removing-item]="removingIds.has(product.id)" *ngFor="let product of products"><div class="position-relative"><app-product-card [product]="product"></app-product-card><button class="btn btn-sm btn-light position-absolute top-0 end-0 m-2 text-danger" title="Remove from wishlist" (click)="remove(product)"><i class="bi bi-x-lg"></i></button></div></div></div><ng-template #empty><div class="text-center py-5"><i class="bi bi-heart fs-1 text-muted empty-state-icon"></i><h2 class="h4 mt-3">Your wishlist is empty.</h2><a routerLink="/shop" class="btn btn-accent mt-2">Find a favourite</a></div></ng-template></ng-container></div></section>
